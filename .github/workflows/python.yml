name: Python CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install -r requirements-smb1-ppo-py312.txt
      
      - name: Run ruff check
        run: python -m ruff check
      
      - name: Run pytest on tests/python and tests/smb1_ppo
        run: python -m pytest tests/python -v --tb=short && python -m pytest tests/smb1_ppo -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/python
