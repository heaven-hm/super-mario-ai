name: Lua checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      
      - name: Run tests
        run: sh tests/run.sh
      
      - name: Check RAM writes are restricted to testing aids
        run: |
          count=$(grep -c 'memory\.writebyte(' scripts/storage.lua || true)
          if [ "$count" -ne 4 ]; then
            echo "Error: Only 4 memory writes allowed (three timers + lives)"
            exit 1
          fi
